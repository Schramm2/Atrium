name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version manifests and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs

      - name: Validate Tauri-to-Swift command inventory
        run: node scripts/check-swift-migration-inventory.mjs --check

      - name: Require a commit from main
        run: |
          git fetch origin main
          RELEASE_COMMIT="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

  publish-macos:
    name: Build and publish macOS release
    needs: validate-release
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build native Swift release
        run: ./script/build_and_run.sh --package

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          VERSION="$(plutil -extract version raw macos/version.json)"
          ARCHIVES_DIR="$RUNNER_TEMP/notive-sparkle-archives"
          mkdir -p "$ARCHIVES_DIR"
          cp "dist/Notive-$VERSION.zip" "$ARCHIVES_DIR/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix \
              "https://github.com/Schramm2/notive/releases/download/$GITHUB_REF_NAME/" \
              -o dist/appcast.xml \
              "$ARCHIVES_DIR"

      - name: Verify release artifacts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="$(plutil -extract version raw macos/version.json)"
          ARCHIVE="dist/Notive-$VERSION.zip"
          DMG="dist/Notive-$VERSION-arm64.dmg"
          APPCAST="dist/appcast.xml"
          codesign --verify --deep --strict dist/Notive.app
          test -d dist/Notive.app/Contents/Frameworks/Sparkle.framework
          test -s dist/Notive.app/Contents/Resources/LICENSE.md
          test -s dist/Notive.app/Contents/Resources/NOTICE.md
          test -s dist/Notive.app/Contents/Resources/Sparkle-LICENSE.txt
          test -s "$ARCHIVE"
          hdiutil verify "$DMG"
          node scripts/check-sparkle-appcast.mjs "$APPCAST" "$VERSION"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            macos/.build/artifacts/sparkle/Sparkle/bin/sign_update \
              --verify --ed-key-file - "$APPCAST"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(plutil -extract version raw macos/version.json)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Notive-$VERSION.zip" \
            "dist/Notive-$VERSION-arm64.dmg" \
            dist/appcast.xml \
            --draft \
            --generate-notes \
            --title "Notive v$VERSION"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
